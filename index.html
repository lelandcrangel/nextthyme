<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Next Thyme is a local-first recipe box with searchable recipes, ingredient scaling, cooking directions, and browser-based persistence."
    />
    <meta name="theme-color" content="#f8f4ed" />

    <!-- Declared explicitly because this deploys into /nextthyme/ on a
         document root shared with three other projects. With nothing declared
         a browser falls back to the ORIGIN root's /favicon.ico, which is the
         portfolio's icon rather than this site's -- and that is what the tab
         actually showed before these three lines existed.

         %BASE_URL% rather than a hardcoded /nextthyme/: the deploy builds with
         VITE_BASE_PATH=./, so these resolve beside index.html wherever the app
         is mounted, and they follow if that base ever changes.

         An earlier version of this comment justified %BASE_URL% by claiming a
         router served paths like /nextthyme/recipe/pot-roast, where a relative
         href would resolve wrongly. That was false: this app has no routing
         dependency at all and /nextthyme/ is the only URL it serves, so a
         relative href has nothing to get wrong here. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:title" content="Next Thyme Recipe Box" />
    <meta
      property="og:description"
      content="A mobile-first recipe manager built with React, TypeScript, Vite, Tailwind CSS, and local browser storage."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%images/recipes/pot-roast-1200.webp" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%images/recipes/pot-roast-640.webp"
      imagesrcset="%BASE_URL%images/recipes/pot-roast-640.webp 640w, %BASE_URL%images/recipes/pot-roast-1200.webp 1200w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Next Thyme Recipe Box</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
